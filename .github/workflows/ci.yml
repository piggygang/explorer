name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The committed generated types must match the vendored spec.
      - run: pnpm gen:api && git diff --exit-code -- lib/api/schema.d.ts
      - run: pnpm lint
      # Linting and standalone typechecking are not part of `next build` in
      # Next 16; `next typegen` generates next-env.d.ts and route types first.
      - run: pnpm exec next typegen && pnpm exec tsc --noEmit
      - run: pnpm build
